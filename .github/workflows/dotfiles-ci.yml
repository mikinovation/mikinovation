name: dotfiles CI

on:
  push:
    branches: [ main ]
    paths:
      - "packages/dotfiles/**"
      - "packages/claude-skills/**"
      - ".github/workflows/dotfiles-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "packages/dotfiles/**"
      - "packages/claude-skills/**"
      - ".github/workflows/dotfiles-ci.yml"

defaults:
  run:
    working-directory: packages/dotfiles

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: packages/dotfiles/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check (lint, format, test)
        run: make check

  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Nix check
        run: make nix-check

  nix-check-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Nix tests
        run: make nix-test

  nvim-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Neovim
        env:
          GH_TOKEN: ${{ github.token }}
          NEOVIM_VERSION: v0.11.6
          NEOVIM_ASSET: nvim-linux-x86_64.tar.gz
        run: |
          asset_id=$(gh api "repos/neovim/neovim/releases/tags/$NEOVIM_VERSION" \
            --jq ".assets[] | select(.name == \"$NEOVIM_ASSET\") | .id")
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o "$RUNNER_TEMP/$NEOVIM_ASSET" \
            "https://api.github.com/repos/neovim/neovim/releases/assets/$asset_id"
          tar -xzf "$RUNNER_TEMP/$NEOVIM_ASSET" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version | head -1
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install luarocks and build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y luarocks lua5.1 liblua5.1-0-dev
          sudo luarocks install luarocks-build-treesitter-parser
          npm install -g tree-sitter-cli

      - name: Cache Neovim plugins
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.local/share/nvim/lazy
            ~/.local/share/nvim/lazy-rocks
          key: nvim-plugins-${{ hashFiles('packages/dotfiles/nix/programs/neovim/nvim/plugins.lua', 'packages/dotfiles/nix/programs/neovim/nvim/plugins/**/*.lua') }}
          restore-keys: |
            nvim-plugins-

      - name: Run Neovim smoke test
        run: make nvim-smoke-test
        timeout-minutes: 5
