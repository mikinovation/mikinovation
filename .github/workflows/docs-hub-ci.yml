name: docs-hub CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - "apps/docs-hub/**"
      - ".github/workflows/docs-hub-ci.yml"

defaults:
  run:
    working-directory: apps/docs-hub

jobs:
  lint-typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/docs-hub/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/docs-hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run oxlint
        run: pnpm lint

      - name: Run oxfmt
        run: pnpm fmt:check

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run build
        run: pnpm build
