name: Secretlint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: packages/dotfiles/package.json

      - name: Install dependencies
        working-directory: packages/dotfiles
        run: pnpm install --frozen-lockfile

      # Scans every tracked file in the repository, not only packages/dotfiles.
      - name: Run Secretlint
        run: |
          git ls-files -z | xargs -0 packages/dotfiles/node_modules/.bin/secretlint \
            --secretlintrc packages/dotfiles/.secretlintrc.json \
            --secretlintignore packages/dotfiles/.secretlintignore
