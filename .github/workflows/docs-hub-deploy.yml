name: docs-hub Deploy

on:
  push:
    branches: [ main ]
    paths:
      - "apps/docs-hub/**"
      - ".github/workflows/docs-hub-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs-hub
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: apps/docs-hub/package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/docs-hub/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/docs-hub/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
